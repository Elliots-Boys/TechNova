<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Search · TechNova</title><link rel="stylesheet" href="../css/style.css"><style>.search-page{max-width:1050px;margin:auto;padding:60px 22px 80px}.search-box{display:flex;gap:10px;margin:25px 0}.search-box input{flex:1;background:#08111e;color:#fff;border:1px solid #20324b;border-radius:11px;padding:14px}.results{display:grid;gap:12px}.result{padding:20px;border:1px solid #20324b;border-radius:15px;background:#09111e}.result small{color:#79c8ff;font-weight:800}.result h2{margin:5px 0}.result p{color:#91a0b7;margin:0}.result a{display:inline-block;margin-top:10px;color:#32d6ff;font-weight:800}.empty{color:#91a0b7}</style></head><body><header><a class="brand" href="../index.html">✦ TECHNOVA</a><button id="menu">☰</button><nav><a href="../index.html">Home</a><a href="events.html">Events</a><a href="technology.html">Technology</a><a href="innovation.html">Innovation</a><a href="news.html">News</a><a href="about.html">About</a><a href="contact.html">Contact</a><a href="account.html">My account</a></nav></header><main class="search-page"><p class="eyebrow">SEARCH TECHNOVA</p><h1>Find what you're <span>looking for.</span></h1><div class="search-box"><input id="searchInput" placeholder="Try AI, robotics, events, security…"><button id="searchButton" class="btn primary">Search</button></div><div id="results" class="results"><p class="empty">Type something above to search.</p></div></main><footer>© 2026 TechNova</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase-config.js"></script><script src="../js/global-search.js"></script><script src="../js/script.js"></script><script>const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function runSearch(){const q=document.getElementById('searchInput').value.trim();const box=document.getElementById('results');if(!q){box.innerHTML='<p class="empty">Type something above to search.</p>';return}box.innerHTML='<p class="empty">Searching TechNova…</p>';try{const results=await TechNovaSearch.search(q,30);box.innerHTML=results.length?results.map(r=>{const type=r.source==='events'?'Event':r.source==='technology_articles'?'Technology':'News';const url=r.source==='events'&&r.id?'event.html?id='+encodeURIComponent(r.id):r.source==='technology_articles'?'technology.html':'news.html';return `<article class="result"><small>${esc(type)}</small><h2>${esc(r.title||'Untitled')}</h2><p>${esc(r.summary||r.description||r.content||'')}</p><a href="${url}">Open →</a></article>`}).join(''):'<p class="empty">No matches found.</p>'}catch(e){console.error(e);box.innerHTML='<p class="empty">Search is temporarily unavailable.</p>'}}document.addEventListener('DOMContentLoaded',()=>{document.getElementById('searchButton').addEventListener('click',runSearch);document.getElementById('searchInput').addEventListener('keydown',e=>{if(e.key==='Enter')runSearch()})});</script></body></html>
