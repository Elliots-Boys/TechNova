<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Search · TechNova</title><link rel="stylesheet" href="../css/style.css"><style>.search-page{max-width:1050px;margin:auto;padding:60px 22px 80px}.search-box{display:flex;gap:10px;margin:25px 0}.search-box input{flex:1;background:#08111e;color:#fff;border:1px solid #20324b;border-radius:11px;padding:14px}.results{display:grid;gap:12px}.result{padding:20px;border:1px solid #20324b;border-radius:15px;background:#09111e}.result small{color:#79c8ff;font-weight:800}.result h2{margin:5px 0}.result p{color:#91a0b7;margin:0}.result a{display:inline-block;margin-top:10px;color:#32d6ff;font-weight:800}.empty{color:#91a0b7}</style></head><body><header><a class="brand" href="../index.html">✦ TECHNOVA</a><button id="menu">☰</button><nav><a href="../index.html">Home</a><a href="events.html">Events</a><a href="technology.html">Technology</a><a href="innovation.html">Innovation</a><a href="news.html">News</a><a href="about.html">About</a><a href="contact.html">Contact</a><a href="account.html">My account</a></nav></header><main class="search-page"><p class="eyebrow">SEARCH TECHNOVA</p><h1>Find what you're <span>looking for.</span></h1><div class="search-box"><input id="searchInput" placeholder="Try AI, robotics, event, security…"><button id="searchButton" class="btn primary">Search</button></div><div id="results" class="results"><p class="empty">Type something above to search.</p></div></main><footer>© 2026 TechNova</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase-config.js"></script><script>const staticItems=[['Technology','Artificial Intelligence','Explore generative AI, machine learning, agents and multimodal systems.','technology.html'],['Technology','Cloud','Explore serverless, containers, distributed systems and platform engineering.','technology.html'],['Technology','Cybersecurity','Explore identity, zero trust, application security and resilience.','technology.html'],['Technology','Robotics','Explore automation, autonomous systems and human-robot collaboration.','technology.html'],['Innovation','Experiment','Prototype, measure what happens and keep the useful parts.','innovation.html'],['Innovation','Collaborate','Find ideas where different disciplines overlap.','innovation.html'],['Resources','AI project checklist','A practical starting point for planning an AI project.','resources.html'],['Support','Account help','Find account settings, profile and password support.','support.html'],['Community','Community','Discover TechNova community topics and guidelines.','community.html']];const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function runSearch(){const q=document.getElementById('searchInput').value.trim().toLowerCase();const box=document.getElementById('results');if(!q){box.innerHTML='<p class="empty">Type something above to search.</p>';return}let results=staticItems.filter(x=>x.join(' ').toLowerCase().includes(q)).map(x=>({type:x[0],title:x[1],text:x[2],url:x[3]}));try{const client=window.supabase.createClient(window.TECHNOVA_SUPABASE_URL,window.TECHNOVA_SUPABASE_PUBLISHABLE_KEY);const {data}=await client.from('events').select('title,event_type,event_date,location,description');(data||[]).forEach(e=>{if([e.title,e.event_type,e.location,e.description].join(' ').toLowerCase().includes(q))results.push({type:'Event',title:e.title,text:(e.description||'')+' '+(e.event_date||'')+' · '+(e.location||''),url:'events.html'})})}catch(e){}box.innerHTML=results.length?results.map(r=>'<article class="result"><small>'+esc(r.type)+'</small><h2>'+esc(r.title)+'</h2><p>'+esc(r.text)+'</p><a href="'+esc(r.url)+'">Open →</a></article>').join(''):'<p class="empty">No matches found.</p>'}document.addEventListener('DOMContentLoaded',()=>{document.getElementById('searchButton').addEventListener('click',runSearch);document.getElementById('searchInput').addEventListener('keydown',e=>{if(e.key==='Enter')runSearch()});const header=document.querySelector('header'),menu=document.querySelector('#menu');menu?.addEventListener('click',()=>header?.classList.toggle('open'))});</script></body></html>
