<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="TechNova project showcase."><title>Showcase · TechNova</title><link rel="stylesheet" href="../css/style.css"><style>.show-controls{display:flex;gap:9px;flex-wrap:wrap;margin:26px 0}.show-filter{border:1px solid #20324b;background:#0b1626;color:#b7c5d9;border-radius:10px;padding:9px 12px;cursor:pointer}.show-filter:hover,.show-filter.active{background:#102844;border-color:#32d6ff;color:#fff}.show-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.show-card{background:linear-gradient(180deg,#0d1728,#09111e);border:1px solid #20324b;border-radius:18px;overflow:hidden}.show-visual{height:150px;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#1b4d73,#0a1220 60%);font-size:46px}.show-body{padding:20px}.show-body h2{margin:7px 0}.show-body p{color:#91a0b7}.show-tags{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}.show-tag{font-size:11px;background:#102844;color:#9fcdf6;padding:4px 8px;border-radius:99px}.show-more{display:block;width:100%;border:1px solid #20324b;background:#0b1626;color:#fff;border-radius:10px;padding:10px;cursor:pointer}.show-detail{display:none;margin-top:10px;padding-top:10px;border-top:1px solid #20324b;color:#91a0b7;font-size:13px}.show-card.open .show-detail{display:block}@media(max-width:950px){.show-grid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.show-grid{grid-template-columns:1fr}}</style></head><body><header><a class="brand" href="../index.html">✦ TECHNOVA</a><button id="menu">☰</button><nav><a href="../index.html">Home</a><a href="events.html">Events</a><a href="technology.html">Technology</a><a href="innovation.html">Innovation</a><a href="news.html">News</a><a href="about.html">About</a><a href="contact.html">Contact</a><a href="account.html">My account</a></nav></header><main class="page"><p class="eyebrow">PROJECT SHOWCASE</p><h1>See what people <span>could build.</span></h1><p class="lead">A gallery of concept projects showing how TechNova's technology areas can combine into useful products.</p><div class="show-controls"><button class="show-filter active" data-filter="">All</button><button class="show-filter" data-filter="AI">AI</button><button class="show-filter" data-filter="Web">Web</button><button class="show-filter" data-filter="Cloud">Cloud</button><button class="show-filter" data-filter="Security">Security</button><button class="show-filter" data-filter="Robotics">Robotics</button></div><div id="showGrid" class="show-grid"></div></main><footer>© 2026 TechNova · Technology for what's next.</footer><script src="../js/script.js"></script><script>const projects=[{icon:'🤖',title:'Signal Assistant',area:'AI',desc:'A concept assistant that turns a messy task into a structured workflow.',tags:['AI','Web','Security'],detail:'Focus areas: useful outputs, clear user controls, evaluation and safe handling of user data.'},{icon:'🌐',title:'NovaBoard',area:'Web',desc:'A collaborative browser workspace for notes, tasks and project signals.',tags:['Web','Cloud','Realtime'],detail:'Focus areas: responsive interfaces, state management and a small service layer.'},{icon:'🛰️',title:'Edge Watch',area:'Cloud',desc:'A dashboard concept for monitoring distributed application signals.',tags:['Cloud','Web','Observability'],detail:'Focus areas: event-driven data, dashboards, alert design and operational visibility.'},{icon:'🦾',title:'Route Rover',area:'Robotics',desc:'A small autonomous rover concept that maps a controlled indoor route.',tags:['Robotics','AI','Sensors'],detail:'Focus areas: sensing, decision loops, physical testing and safe boundaries.'},{icon:'🛡️',title:'Trust Console',area:'Security',desc:'A concept control panel for reviewing identity and application access.',tags:['Security','Web','Identity'],detail:'Focus areas: least privilege, audit visibility and understandable access decisions.'},{icon:'🎮',title:'Pulse World',area:'Interactive',desc:'A realtime creative playground where actions change a shared visual world.',tags:['Interactive','Web','Realtime'],detail:'Focus areas: realtime state, performance, interaction feedback and accessible controls.'}];const grid=document.getElementById('showGrid');function render(filter=''){grid.innerHTML=projects.filter(p=>!filter||p.area===filter||p.tags.includes(filter)).map((p,i)=>'<article class="show-card"><div class="show-visual">'+p.icon+'</div><div class="show-body"><span class="badge">'+p.area+'</span><h2>'+p.title+'</h2><p>'+p.desc+'</p><div class="show-tags">'+p.tags.map(t=>'<span class="show-tag">'+t+'</span>').join('')+'</div><button class="show-more" type="button" data-index="'+i+'">View concept</button><div class="show-detail">'+p.detail+'</div></div></article>').join('')||'<div class="panel" style="grid-column:1/-1">No showcase projects match that filter.</div>';grid.querySelectorAll('.show-more').forEach(b=>b.addEventListener('click',()=>{b.closest('.show-card').classList.toggle('open');b.textContent=b.closest('.show-card').classList.contains('open')?'Hide concept':'View concept'}))}document.querySelectorAll('.show-filter').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.show-filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.filter)}));render();</script></body></html>
