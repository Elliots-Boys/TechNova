<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Submit an Idea · TechNova</title><link rel="stylesheet" href="../css/style.css"></head><body><header><a class="brand" href="../index.html">✦ TECHNOVA</a><button id="menu">☰</button><nav><a href="../index.html">Home</a><a href="events.html">Events</a><a href="technology.html">Technology</a><a href="innovation.html">Innovation</a><a href="news.html">News</a><a href="discover.html">Discover</a><a href="account.html">My account</a></nav></header><main class="page"><p class="eyebrow">COMMUNITY</p><h1>Submit an <span>idea.</span></h1><p class="lead">Have a project, experiment or technology topic worth sharing? Send us the details.</p><form class="panel" id="ideaForm" style="display:grid;gap:15px;max-width:760px"><label>Title<input class="input" required name="title" placeholder="My technology idea"></label><label>Category<select class="select" name="category"><option>AI</option><option>Web</option><option>Cloud</option><option>Security</option><option>Robotics</option><option>Other</option></select></label><label>Description<textarea class="input" required name="description" rows="7" placeholder="Tell us about it..."></textarea></label><button class="btn primary" type="submit">Submit idea →</button></form></main><footer>© 2026 TechNova · Technology for what's next.</footer><script src="../js/script.js"></script><script>document.getElementById('ideaForm').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.currentTarget);const ideas=JSON.parse(localStorage.getItem('technova_ideas')||'[]');ideas.push({title:f.get('title'),category:f.get('category'),description:f.get('description'),created:new Date().toISOString()});localStorage.setItem('technova_ideas',JSON.stringify(ideas));e.currentTarget.reset();window.TechNovaToast?.('Idea saved. Thanks for contributing!');if(!window.TechNovaToast)alert('Idea submitted!')});</script></body></html>
