<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account · TechNova"><link rel="stylesheet" href="../css/style.css"><style>.auth{max-width:520px;margin:80px auto}.auth-message{margin-top:14px;padding:12px;border-radius:10px;background:#3a1620;color:#ff9aaa}.auth-message.good{background:#0b332b;color:#70f0c1}.auth input{margin:7px 0 14px}</style></head><body><main class="container"><section class="card auth"><div class="eyebrow">Join TechNova</div><h1 style="font-size:48px">Create your <span>account.</span></h1><p class="muted">Save events, manage registrations and build your technology profile.</p><label>Name</label><input id="name" class="input" autocomplete="name"><label>Email</label><input id="email" class="input" type="email" autocomplete="email"><label>Password</label><input id="password" class="input" type="password" minlength="8" autocomplete="new-password"><button id="signupBtn" class="btn primary">Create account</button><p class="muted">Already registered? <a href="login.html" style="color:#32d6ff">Log in</a></p><div id="authMessage" class="auth-message" aria-live="polite"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase-config.js"></script><script src="../js/auth.js"></script></body></html>
