<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Glossary · TechNova</title><link rel="stylesheet" href="../css/style.css"><style>.glossary-search{margin:28px 0}.letters{display:flex;gap:6px;flex-wrap:wrap;margin:15px 0 24px}.letter{border:1px solid #20324b;background:#0b1626;color:#cfe1f5;border-radius:9px;padding:7px 10px;cursor:pointer}.letter:hover,.letter.active{background:#102c48;border-color:#32d6ff;color:#fff}.glossary-list{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.term{padding:18px;border:1px solid #20324b;background:#09111e;border-radius:15px}.term h2{margin:0 0 5px}.term p{margin:0;color:#91a0b7}.term small{display:block;color:#32d6ff;font-weight:900;margin-bottom:5px;text-transform:uppercase;letter-spacing:.08em}@media(max-width:700px){.glossary-list{grid-template-columns:1fr}}</style></head><body><header><a class="brand" href="../index.html">✦ TECHNOVA</a><button id="menu">☰</button><nav><a href="../index.html">Home</a><a href="events.html">Events</a><a href="technology.html">Technology</a><a href="innovation.html">Innovation</a><a href="news.html">News</a><a href="about.html">About</a><a href="contact.html">Contact</a><a href="account.html">My account</a></nav></header><main class="page"><p class="eyebrow">TECH GLOSSARY</p><h1>Understand the <span>language.</span></h1><p class="lead">A quick-reference glossary for the terms that appear across TechNova.</p><div class="glossary-search"><input id="glossarySearch" class="input" placeholder="Search a term or definition…"></div><div id="letters" class="letters"></div><div id="glossaryList" class="glossary-list"></div></main><footer>© 2026 TechNova · Technology for what's next.</footer><script src="../js/script.js"></script><script>const terms=[
['AI','Agent','A system that can plan and execute actions toward a goal using tools.'],
['AI','Inference','Running a trained model to produce an output from new input.'],
['Cloud','Serverless','A cloud approach where infrastructure operations are largely handled by the provider.'],
['Cloud','Edge computing','Processing data closer to where it is generated or consumed.'],
['Security','Zero trust','A security approach that continuously evaluates identity, context and access.'],
['Security','Passkey','A public-key credential used for passwordless sign-in.'],
['Web','API','A defined way for software systems to communicate and exchange data.'],
['Web','WebGPU','A web API for accessing modern GPU capabilities from supported browsers.'],
['Robotics','Digital twin','A digital representation used to model or monitor a physical system.'],
['Interactive','Spatial computing','Computing experiences that understand or use a 3D or physical context.'],
['AI','Multimodal','A system that works across more than one input or output modality.'],
['Web','Accessibility','Designing technology so people with different abilities can use it effectively.'],
['AI','Machine learning','A type of AI where systems learn patterns from data to make predictions or decisions.'],
['AI','Neural network','A machine-learning model made from connected computational units inspired by biological neurons.'],
['AI','Large language model','An AI model trained on large amounts of text to understand and generate language.'],
['AI','Prompt','Instructions or input provided to an AI system to guide its response.'],
['AI','Generative AI','AI that creates new content such as text, images, audio, video or code.'],
['Cloud','Virtual machine','A software-based computer that runs an operating system and applications using virtualised hardware.'],
['Cloud','Container','A lightweight isolated environment that packages an application with its dependencies.'],
['Cloud','Kubernetes','A platform for deploying, scaling and managing containerised applications.'],
['Security','Encryption','The process of transforming information so only authorised parties can read it.'],
['Security','Firewall','A security system that controls network traffic according to defined rules.'],
['Security','Authentication','The process of verifying that a person or system is who they claim to be.'],
['Security','Authorisation','The process of deciding what an authenticated user or system is allowed to access.'],
['Web','HTML','The markup language used to structure content on web pages.'],
['Web','CSS','A language used to control the presentation, layout and appearance of web pages.'],
['Web','JavaScript','A programming language commonly used to add interactive behaviour to websites.'],
['Web','DOM','The Document Object Model represents a web page as objects that JavaScript can inspect and change.'],
['Web','HTTPS','The encrypted version of HTTP used to securely transfer data between a browser and server.'],
['Web','JSON','A lightweight text format commonly used to exchange structured data between systems.'],
['Web','REST','An architectural style commonly used for designing web APIs around resources and HTTP methods.'],
['Web','Responsive design','Designing a website so its layout adapts to different screen sizes and devices.'],
['Data','Database','An organised system for storing, managing and retrieving structured information.'],
['Data','SQL','A language used to query and manage data in relational databases.'],
['Data','Relational database','A database that stores data in tables connected through defined relationships.'],
['Data','Primary key','A column or set of columns that uniquely identifies a row in a database table.'],
['Data','Foreign key','A database field that references a row in another table to create a relationship.'],
['Data','RLS','Row Level Security controls which database rows individual users are allowed to access.'],
['Networking','IP address','A numerical address used to identify a device or network interface.'],
['Networking','DNS','The system that translates domain names into network addresses such as IP addresses.'],
['Networking','Latency','The delay between sending data or a request and receiving a response.'],
['Networking','Bandwidth','The amount of data that can be transferred over a connection in a given period.'],
['Networking','CDN','A content delivery network distributes content through servers closer to users.'],
['Hardware','GPU','A processor designed to perform many calculations in parallel, especially for graphics and AI workloads.'],
['Hardware','CPU','The central processing unit executes instructions and performs general-purpose calculations.'],
['Hardware','RAM','Short-term computer memory used to hold data and programs that are currently in use.'],
['Hardware','SSD','A solid-state drive stores data using flash memory and has no moving mechanical parts.'],
['Robotics','Sensor','A device that detects physical conditions such as light, temperature, movement or distance.'],
['Robotics','Actuator','A component that converts control signals into physical movement.'],
['Robotics','Computer vision','Technology that enables computers to analyse and interpret images or video.'],
['Interactive','Virtual reality','A technology that creates an immersive computer-generated environment.'],
['Interactive','Augmented reality','Technology that overlays digital information or objects onto the real world.'],
['Interactive','UX','User experience describes how a person feels when interacting with a product or service.'],
['Interactive','UI','User interface refers to the visual and interactive elements people use to operate software.'],
['Software','Open source','Software whose source code is available for inspection, modification and redistribution under its licence.'],
['Software','Version control','A system for tracking changes to files and collaborating on software projects.'],
['Software','Git','A distributed version-control system commonly used for software development.'],
['Software','Repository','A storage location containing a project's files, history and version-control information.'],
['Software','API key','A secret credential used by some services to identify and authorise API requests.']
];const list=document.getElementById('glossaryList'),letters=document.getElementById('letters'),input=document.getElementById('glossarySearch');let active='';const abc=[...new Set(terms.map(t=>t[1][0].toUpperCase()))].sort();letters.innerHTML='<button class="letter active" data-letter="">All</button>'+abc.map(l=>'<button class="letter" data-letter="'+l+'">'+l+'</button>').join('');function draw(){const q=input.value.toLowerCase().trim();const items=terms.filter(t=>(!active||t[1][0].toUpperCase()===active)&&(!q||t.join(' ').toLowerCase().includes(q))).sort((a,b)=>a[1].localeCompare(b[1]));list.innerHTML=items.length?items.map(t=>'<article class="term"><small>'+t[0]+'</small><h2>'+t[1]+'</h2><p>'+t[2]+'</p></article>').join(''):'<div class="panel" style="grid-column:1/-1">No matching glossary terms.</div>'}letters.addEventListener('click',e=>{if(!e.target.matches('[data-letter]'))return;active=e.target.dataset.letter;letters.querySelectorAll('.letter').forEach(b=>b.classList.toggle('active',b.dataset.letter===active));draw()});input.addEventListener('input',draw);draw();</script></body></html>
