<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Glossary · TechNova</title><link rel="stylesheet" href="../css/style.css"><style>.glossary-search{margin:28px 0}.letters{display:flex;gap:6px;flex-wrap:wrap;margin:15px 0 24px}.letter{border:1px solid #20324b;background:#0b1626;color:#cfe1f5;border-radius:9px;padding:7px 10px;cursor:pointer}.letter:hover,.letter.active{background:#102c48;border-color:#32d6ff;color:#fff}.glossary-list{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.term{padding:18px;border:1px solid #20324b;background:#09111e;border-radius:15px}.term h2{margin:0 0 5px}.term p{margin:0;color:#91a0b7}.term small{display:block;color:#32d6ff;font-weight:900;margin-bottom:5px;text-transform:uppercase;letter-spacing:.08em}@media(max-width:700px){.glossary-list{grid-template-columns:1fr}}</style></head><body><header><a class="brand" href="../index.html">✦ TECHNOVA</a><button id="menu">☰</button><nav><a href="../index.html">Home</a><a href="events.html">Events</a><a href="technology.html">Technology</a><a href="innovation.html">Innovation</a><a href="news.html">News</a><a href="about.html">About</a><a href="contact.html">Contact</a><a href="account.html">My account</a></nav></header><main class="page"><p class="eyebrow">TECH GLOSSARY</p><h1>Understand the <span>language.</span></h1><p class="lead">A quick-reference glossary for the terms that appear across TechNova.</p><div class="glossary-search"><input id="glossarySearch" class="input" placeholder="Search a term or definition…"></div><div id="letters" class="letters"></div><div id="glossaryList" class="glossary-list"></div></main><footer>© 2026 TechNova · Technology for what's next.</footer><script src="../js/script.js"></script><script>const terms=[['AI','Agent','A system that can plan and execute actions toward a goal using tools.'],['AI','Inference','Running a trained model to produce an output from new input.'],['Cloud','Serverless','A cloud approach where infrastructure operations are largely handled by the provider.'],['Cloud','Edge computing','Processing data closer to where it is generated or consumed.'],['Security','Zero trust','A security approach that continuously evaluates identity, context and access.'],['Security','Passkey','A public-key credential used for passwordless sign-in.'],['Web','API','A defined way for software systems to communicate and exchange data.'],['Web','WebGPU','A web API for accessing modern GPU capabilities from supported browsers.'],['Robotics','Digital twin','A digital representation used to model or monitor a physical system.'],['Interactive','Spatial computing','Computing experiences that understand or use a 3D or physical context.'],['AI','Multimodal','A system that works across more than one input or output modality.'],['Web','Accessibility','Designing technology so people with different abilities can use it effectively.']];const list=document.getElementById('glossaryList'),letters=document.getElementById('letters'),input=document.getElementById('glossarySearch');let active='';const abc=[...new Set(terms.map(t=>t[1][0].toUpperCase()))].sort();letters.innerHTML='<button class="letter active" data-letter="">All</button>'+abc.map(l=>'<button class="letter" data-letter="'+l+'">'+l+'</button>').join('');function draw(){const q=input.value.toLowerCase().trim();const items=terms.filter(t=>(!active||t[1][0].toUpperCase()===active)&&(!q||t.join(' ').toLowerCase().includes(q))).sort((a,b)=>a[1].localeCompare(b[1]));list.innerHTML=items.length?items.map(t=>'<article class="term"><small>'+t[0]+'</small><h2>'+t[1]+'</h2><p>'+t[2]+'</p></article>').join(''):'<div class="panel" style="grid-column:1/-1">No matching glossary terms.</div>'}letters.addEventListener('click',e=>{if(!e.target.matches('[data-letter]'))return;active=e.target.dataset.letter;letters.querySelectorAll('.letter').forEach(b=>b.classList.toggle('active',b.dataset.letter===active));draw()});input.addEventListener('input',draw);draw();</script></body></html>
