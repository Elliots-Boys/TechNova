<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Saved · TechNova</title><link rel="stylesheet" href="../css/style.css"><style>.saved-page{max-width:1050px;margin:auto;padding:60px 22px 80px}.saved-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.saved-card{padding:20px;border:1px solid #20324b;border-radius:15px;background:#09111e}.saved-card p{color:#91a0b7}.remove{margin-top:10px}@media(max-width:700px){.saved-grid{grid-template-columns:1fr}}</style></head><body><header><a class="brand" href="../index.html">✦ TECHNOVA</a><button id="menu">☰</button><nav><a href="../index.html">Home</a><a href="events.html">Events</a><a href="technology.html">Technology</a><a href="innovation.html">Innovation</a><a href="news.html">News</a><a href="about.html">About</a><a href="contact.html">Contact</a><a href="account.html">My account</a></nav></header><main class="saved-page"><p class="eyebrow">SAVED</p><h1>Your saved <span>technology.</span></h1><p class="lead">Save topics from the Technology page and come back to them later.</p><div id="savedGrid" class="saved-grid"></div></main><footer>© 2026 TechNova</footer><script>const key='technova_saved_topics';const fallback={AI:{title:'Artificial Intelligence',text:'Generative AI, machine learning, agents and multimodal systems.'},Cloud:{title:'Cloud',text:'Serverless, containers, distributed systems and platform engineering.'},Security:{title:'Cybersecurity',text:'Identity, zero trust, application security and resilience.'},Robotics:{title:'Robotics',text:'Automation, autonomous systems and human-robot collaboration.'},Web:{title:'Web',text:'Frontend, APIs, edge computing, accessibility and immersive interfaces.'},Interactive:{title:'Interactive',text:'Games, realtime experiences, spatial computing and creative technology.'}};function draw(){const grid=document.getElementById('savedGrid'),items=JSON.parse(localStorage.getItem(key)||'[]');if(!items.length){grid.innerHTML='<div class="panel"><h2>No saved topics yet</h2><p class="muted">Open the Technology page and use the Save buttons to build your list.</p><a class="btn primary" href="technology.html">Explore technology →</a></div>';return}grid.innerHTML=items.map(id=>{const v=fallback[id]||{title:id,text:''};return '<article class="saved-card"><h2>'+v.title+'</h2><p>'+v.text+'</p><button class="btn remove" data-id="'+id+'">Remove</button></article>'}).join('');grid.querySelectorAll('.remove').forEach(b=>b.addEventListener('click',()=>{const next=JSON.parse(localStorage.getItem(key)||'[]').filter(x=>x!==b.dataset.id);localStorage.setItem(key,JSON.stringify(next));draw()}))}document.addEventListener('DOMContentLoaded',draw)</script></body></html>
