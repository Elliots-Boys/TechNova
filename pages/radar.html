<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="TechNova Tech Radar — explore technology patterns and tools by maturity and area."><title>Tech Radar · TechNova</title><link rel="stylesheet" href="../css/style.css"><style>.radar-controls{display:flex;gap:10px;flex-wrap:wrap;margin:28px 0}.radar-controls input{flex:1;min-width:220px}.radar-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.radar-card{background:linear-gradient(180deg,#0d1728,#09111e);border:1px solid #20324b;border-radius:18px;padding:22px;display:flex;flex-direction:column;min-height:220px}.radar-top{display:flex;justify-content:space-between;gap:10px;align-items:center}.radar-card h2{margin:12px 0 7px}.radar-card p{color:#91a0b7}.radar-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}.radar-tag{font-size:11px;padding:4px 8px;border-radius:99px;background:#102844;color:#9fcdf6}.maturity{font-weight:900;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#32d6ff}.radar-empty{grid-column:1/-1}@media(max-width:900px){.radar-grid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.radar-grid{grid-template-columns:1fr}.radar-controls input{min-width:100%}}</style></head><body><header><a class="brand" href="../index.html">✦ TECHNOVA</a><button id="menu" aria-label="Open navigation">☰</button><nav><a href="../index.html">Home</a><a href="events.html">Events</a><a href="technology.html">Technology</a><a href="innovation.html">Innovation</a><a href="news.html">News</a><a href="about.html">About</a><a href="contact.html">Contact</a><a href="account.html">My account</a></nav></header><main class="page"><p class="eyebrow">TECHNOVA RADAR</p><h1>See what is <span>moving.</span></h1><p class="lead">A visual guide to technology patterns, from established foundations to emerging ideas worth exploring.</p><div class="radar-controls"><input id="radarSearch" class="input" placeholder="Search technologies, categories or tags…"><select id="radarArea" class="select" style="max-width:190px"><option value="">All areas</option><option>AI</option><option>Web</option><option>Cloud</option><option>Security</option><option>Robotics</option><option>Interactive</option></select><select id="radarMaturity" class="select" style="max-width:190px"><option value="">All maturity</option><option>Established</option><option>Adopt</option><option>Explore</option><option>Emerging</option></select></div><div id="radarGrid" class="radar-grid"></div></main><footer>© 2026 TechNova · Technology for what's next.</footer><script src="../js/script.js"></script><script>const radarItems=[{name:'Edge AI',area:'AI',maturity:'Explore',desc:'Run smaller intelligence workloads closer to where data is created.',tags:['on-device','latency','privacy']},{name:'AI agents',area:'AI',maturity:'Explore',desc:'Systems that can plan and execute multi-step tasks with tools and guardrails.',tags:['automation','workflows','orchestration']},{name:'WebGPU',area:'Web',maturity:'Adopt',desc:'Browser access to modern GPU capabilities for richer client-side experiences.',tags:['graphics','compute','browser']},{name:'Passkeys',area:'Security',maturity:'Adopt',desc:'Passwordless sign-in built around public-key credentials.',tags:['identity','auth','phishing-resistant']},{name:'Serverless',area:'Cloud',maturity:'Established',desc:'Event-driven application components managed without traditional server operations.',tags:['functions','scaling','managed']},{name:'Digital twins',area:'Robotics',maturity:'Explore',desc:'Virtual representations used to model or monitor physical systems.',tags:['simulation','sensors','operations']},{name:'Spatial interfaces',area:'Interactive',maturity:'Emerging',desc:'Interfaces that blend digital information with physical or spatial context.',tags:['3D','AR','interaction']},{name:'Zero trust',area:'Security',maturity:'Established',desc:'A security model that continuously verifies identity, context and access.',tags:['identity','policy','least privilege']},{name:'Platform engineering',area:'Cloud',maturity:'Adopt',desc:'Internal platforms designed to make software delivery more repeatable for teams.',tags:['developer experience','platforms','automation']}];const grid=document.getElementById('radarGrid'),search=document.getElementById('radarSearch'),area=document.getElementById('radarArea'),maturity=document.getElementById('radarMaturity');function drawRadar(){const q=search.value.toLowerCase().trim(),a=area.value,m=maturity.value;const items=radarItems.filter(x=>(!q||[x.name,x.area,x.maturity,x.desc,...x.tags].join(' ').toLowerCase().includes(q))&&(!a||x.area===a)&&(!m||x.maturity===m));grid.innerHTML=items.length?items.map(x=>'<article class="radar-card"><div class="radar-top"><span class="badge">'+x.area+'</span><span class="maturity">'+x.maturity+'</span></div><h2>'+x.name+'</h2><p>'+x.desc+'</p><div class="radar-tags">'+x.tags.map(t=>'<span class="radar-tag">'+t+'</span>').join('')+'</div></article>').join(''):'<div class="panel radar-empty">No radar entries match those filters.</div>'}search.addEventListener('input',drawRadar);area.addEventListener('change',drawRadar);maturity.addEventListener('change',drawRadar);drawRadar();</script></body></html>
