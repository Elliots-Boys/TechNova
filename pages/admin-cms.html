<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Content Management · TechNova Admin</title><link rel="stylesheet" href="../css/style.css"><style>.page{max-width:1200px;margin:auto;padding:45px 22px 80px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.editor{padding:22px;border:1px solid #243955;border-radius:18px;background:#0d1728}.form{display:grid;gap:13px}.form label{display:grid;gap:6px;font-weight:700}.form input,.form textarea,.form select{background:#07101c;color:#fff;border:1px solid #29415e;border-radius:9px;padding:10px;font:inherit}.form textarea{min-height:150px}.list{display:grid;gap:12px;margin-top:20px}.item{padding:17px;border:1px solid #243955;border-radius:14px;background:#09111e}.item h3{margin:0 0 5px}.item p{color:#91a0b7}.actions{display:flex;gap:8px;flex-wrap:wrap}.status{color:#91a0b7}.published{color:#75efc2}.draft{color:#ffd166}</style></head>
<body><main class="page"><div style="display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap"><div><p class="eyebrow">CONTENT MANAGEMENT</p><h1>TechNova CMS</h1><p class="lead">Manage technology articles, news posts and website content.</p></div><a class="btn" href="admin.html">← Admin dashboard</a></div><div class="tabs"><button class="btn primary" data-table="technology_articles">Technology</button><button class="btn" data-table="news_posts">News</button></div><section class="editor"><form id="form" class="form"><input type="hidden" id="id"><label>Title<input id="title" required></label><label>Summary<textarea id="summary"></textarea></label><label>Content<textarea id="content"></textarea></label><label>Image URL<input id="image" type="url"></label><label>Published<select id="published"><option value="false">Draft</option><option value="true">Published</option></select></label><div class="actions"><button class="btn primary" type="submit">Save</button><button class="btn" type="button" id="new">New</button></div><p id="status" class="status"></p></form></section><section id="list" class="list"></section></main><footer>© 2026 TechNova</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase-config.js"></script><script src="../js/cms.js"></script><script src="../js/script.js"></script><script>
let table='technology_articles';const list=document.getElementById('list');const status=document.getElementById('status');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function load(){try{const rows=await TechNovaCMS.listArticles(table);list.innerHTML=rows.length?rows.map(x=>`<article class="item"><h3>${esc(x.title||'Untitled')}</h3><p>${esc(x.summary||x.excerpt||'')}</p><div class="actions"><span class="${x.published?'published':'draft'}">${x.published?'Published':'Draft'}</span><button class="btn" data-edit="${esc(x.id)}">Edit</button><button class="btn" data-publish="${esc(x.id)}">${x.published?'Unpublish':'Publish'}</button><button class="btn" data-delete="${esc(x.id)}">Delete</button></div></article>`).join(''):'<p class="status">No content found.</p>';list.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit));list.querySelectorAll('[data-publish]').forEach(b=>b.onclick=async()=>{const rows=await TechNovaCMS.listArticles(table);const x=rows.find(r=>String(r.id)===b.dataset.publish);if(x){await TechNovaCMS.publish(table,x.id,!x.published);load()}});list.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(confirm('Delete this post?')){await TechNovaCMS.remove(table,b.dataset.delete);load()}})}catch(e){list.innerHTML='<p class="status">This content table is not available yet. No database changes were made by this page.</p>';console.error(e)}}async function edit(id){const rows=await TechNovaCMS.listArticles(table);const x=rows.find(r=>String(r.id)===String(id));if(!x)return;document.getElementById('id').value=x.id;document.getElementById('title').value=x.title||'';document.getElementById('summary').value=x.summary||x.excerpt||'';document.getElementById('content').value=x.content||'';document.getElementById('image').value=x.image_url||'';document.getElementById('published').value=String(!!x.published);scrollTo({top:0,behavior:'smooth'})}document.querySelectorAll('[data-table]').forEach(b=>b.onclick=()=>{table=b.dataset.table;document.querySelectorAll('[data-table]').forEach(x=>x.classList.toggle('primary',x===b));document.getElementById('new').click();load()});document.getElementById('new').onclick=()=>{document.getElementById('form').reset();document.getElementById('id').value='';status.textContent='';};document.getElementById('form').onsubmit=async e=>{e.preventDefault();try{const values={title:title.value.trim(),summary:summary.value.trim(),content:content.value,image_url:image.value.trim(),published:published.value==='true'};if(id.value)await TechNovaCMS.update(table,id.value,values);else await TechNovaCMS.create(table,values);status.textContent='Saved successfully.';load()}catch(err){status.textContent=err.message||'Could not save content.'}};load();
</script></body></html>
