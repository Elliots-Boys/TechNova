<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Analytics · TechNova</title><link rel="stylesheet" href="../css/style.css"><style>.analytics-page{max-width:1200px;margin:auto;padding:50px 22px 80px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:25px 0}.stat{padding:20px;border:1px solid #20324b;border-radius:16px;background:#08111e}.stat strong{display:block;font-size:32px;color:#32d6ff}.stat span{color:#91a0b7;font-size:13px}.analytics-card{padding:22px;border:1px solid #20324b;border-radius:18px;background:#09111e;margin-top:18px}.analytics-card h2{margin-top:0}.list-row{display:flex;justify-content:space-between;gap:15px;padding:12px 0;border-bottom:1px solid #20324b}.list-row:last-child{border-bottom:0}.muted{color:#91a0b7}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.stats{grid-template-columns:1fr}}</style></head><body><header><a class="brand" href="../index.html">✦ TECHNOVA</a><button id="menu">☰</button><nav><a href="../index.html">Home</a><a href="events.html">Events</a><a href="technology.html">Technology</a><a href="news.html">News</a><a href="account.html">Account</a><a href="admin.html">Admin</a></nav></header><main class="analytics-page"><p class="eyebrow">ADMIN INSIGHTS</p><h1>TechNova <span>analytics.</span></h1><p id="accessMessage" class="lead">Checking administrator access…</p><section id="dashboard" style="display:none"><section class="stats"><div class="stat"><strong id="users">—</strong><span>Total users</span></div><div class="stat"><strong id="week">—</strong><span>New users this week</span></div><div class="stat"><strong id="registrations">—</strong><span>Total registrations</span></div><div class="stat"><strong id="events">—</strong><span>Total events</span></div></section><section class="analytics-card"><h2>Most popular events</h2><div id="popular"><p class="muted">Loading…</p></div></section><section class="analytics-card"><h2>Upcoming events</h2><div id="upcoming"><p class="muted">Loading…</p></div></section><section class="analytics-card"><h2>Recently registered users</h2><div id="recent"><p class="muted">Loading…</p></div></section></section></main><footer>© 2026 TechNova</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase-config.js"></script><script src="../js/analytics.js"></script><script src="../js/script.js"></script><script>const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));(async()=>{const client=window.supabase.createClient(window.TECHNOVA_SUPABASE_URL,window.TECHNOVA_SUPABASE_PUBLISHABLE_KEY);try{const {data:{user}}=await client.auth.getUser();if(!user){location.href='login.html';return}const {data:role}=await client.from('user_roles').select('role').eq('user_id',user.id).maybeSingle();if(role?.role!=='admin'){location.href='account.html';return}document.getElementById('dashboard').style.display='block';document.getElementById('accessMessage').textContent='Administrator-only live statistics.';const s=await TechNovaAnalytics.dashboardStats();users.textContent=s.users;week.textContent=s.newUsersWeek;registrations.textContent=s.registrations;events.textContent=s.events;popular.innerHTML=s.mostPopular.length?s.mostPopular.slice(0,8).map(x=>`<div class="list-row"><span>${esc(x.title)}</span><strong>${x.registrations}</strong></div>`).join(''):'<p class="muted">No registration data yet.</p>';upcoming.innerHTML=s.upcoming.length?s.upcoming.map(x=>`<div class="list-row"><span>${esc(x.title)}</span><span class="muted">${esc(x.event_date||'')}</span></div>`).join(''):'<p class="muted">No upcoming events.</p>';recent.innerHTML=s.recentUsers.length?s.recentUsers.map(x=>`<div class="list-row"><span>${esc(x.display_name||'Unnamed user')}</span><span class="muted">${x.created_at?new Date(x.created_at).toLocaleDateString():''}</span></div>`).join(''):'<p class="muted">No users yet.</p>'}catch(e){console.error(e);document.getElementById('accessMessage').textContent='Analytics could not be loaded.'}})();</script></body></html>
