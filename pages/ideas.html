<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ideas · TechNova</title><link rel="stylesheet" href="../css/style.css"></head><body><header><a class="brand" href="../index.html">✦ TECHNOVA</a><button id="menu">☰</button><nav><a href="../index.html">Home</a><a href="discover.html">Discover</a><a href="labs.html">Labs</a></nav></header><main class="page"><p class="eyebrow">IDEA BOARD</p><h1>Capture your next <span>idea.</span></h1><p class="lead">Write an idea and keep it in this browser for later.</p><form id="ideaForm" class="panel"><input class="input" id="idea" required placeholder="e.g. realtime study planner"><button class="btn primary" type="submit">Save idea</button></form><div id="ideas" class="cards" style="margin-top:20px"></div></main><footer>© 2026 TechNova</footer><script src="../js/script.js"></script><script>const k='tn-ideas',box=document.getElementById('ideas'),form=document.getElementById('ideaForm'),input=document.getElementById('idea');function draw(){const a=JSON.parse(localStorage.getItem(k)||'[]');box.innerHTML=a.map((x,i)=>'<article><h2>'+x+'</h2><button class="btn" data-i="'+i+'">Remove</button></article>').join('')||'<article><h2>No ideas yet</h2><p>Save your first idea above.</p></article>';box.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{a.splice(+b.dataset.i,1);localStorage.setItem(k,JSON.stringify(a));draw()})}form.onsubmit=e=>{e.preventDefault();const a=JSON.parse(localStorage.getItem(k)||'[]');a.unshift(input.value.trim());localStorage.setItem(k,JSON.stringify(a));input.value='';draw()};draw();</script></body></html>
