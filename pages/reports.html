<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Report · TechNova</title><link rel="stylesheet" href="../css/style.css"><style>.report-page{max-width:800px;margin:auto;padding:55px 22px 80px}.report-card{padding:26px;border:1px solid #20324b;border-radius:20px;background:linear-gradient(180deg,#101b2d,#09111d)}.report-form{display:grid;gap:15px}.report-form label{display:grid;gap:7px;font-weight:700}.report-form input,.report-form select,.report-form textarea{background:#07101c;color:white;border:1px solid #29415e;border-radius:9px;padding:11px;font:inherit}.report-form textarea{min-height:130px}.status{display:none;padding:12px;border-radius:10px}.status.show{display:block}.status.good{background:#0c342b;color:#75efc2}.status.bad{background:#421820;color:#ff9aaa}</style></head>
<body><header><a class="brand" href="../index.html">✦ TECHNOVA</a><button id="menu">☰</button><nav><a href="../index.html">Home</a><a href="events.html">Events</a><a href="technology.html">Technology</a><a href="innovation.html">Innovation</a><a href="news.html">News</a><a href="about.html">About</a><a href="contact.html">Contact</a><a href="account.html">My account</a></nav></header><main class="report-page"><p class="eyebrow">COMMUNITY SAFETY</p><h1>Report something</h1><p class="lead">Tell the TechNova team about content or activity that needs attention.</p><section class="report-card"><form id="reportForm" class="report-form"><label>What are you reporting?<select id="reason"><option>Spam</option><option>Harassment</option><option>Inappropriate content</option><option>Misleading information</option><option>Other</option></select></label><label>Details<textarea id="details" placeholder="Tell us what happened…"></textarea></label><button class="btn primary" type="submit">Submit report</button><div id="status" class="status"></div></form></section></main><footer>© 2026 TechNova</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase-config.js"></script><script src="../js/reports.js"></script><script src="../js/script.js"></script><script>const p=new URLSearchParams(location.search);document.getElementById('reportForm').addEventListener('submit',async e=>{e.preventDefault();const s=document.getElementById('status');try{await TechNovaReports.report(p.get('type')||'general',p.get('id')||null,document.getElementById('reason').value,document.getElementById('details').value);s.textContent='Report submitted successfully. Thank you.';s.className='status show good';e.target.reset()}catch(err){s.textContent=err.message||'Could not submit the report.';s.className='status show bad'}});</script></body></html>
