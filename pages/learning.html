<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="TechNova learning paths for exploring technology."><title>Learning · TechNova</title><link rel="stylesheet" href="../css/style.css"><style>.path-controls{display:flex;gap:10px;flex-wrap:wrap;margin:26px 0}.path-controls>*{flex:1;min-width:190px}.path-layout{display:grid;grid-template-columns:.75fr 1.25fr;gap:18px}.path-list{display:grid;gap:8px}.path-btn{width:100%;text-align:left;padding:14px;border:1px solid #20324b;background:#09111e;color:#cfe1f5;border-radius:12px;cursor:pointer}.path-btn:hover,.path-btn.active{background:#102844;border-color:#32d6ff;color:#fff}.path-panel{background:linear-gradient(180deg,#0d1728,#09111e);border:1px solid #20324b;border-radius:20px;padding:25px}.path-meta{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 18px}.phase{padding:15px;border:1px solid #20324b;background:#08111e;border-radius:14px}.phase-grid{display:grid;gap:9px}.phase strong{display:block}.phase span{display:block;color:#91a0b7;font-size:13px;margin-top:3px}@media(max-width:800px){.path-layout{grid-template-columns:1fr}.path-controls>*{min-width:100%}}</style></head><body><header><a class="brand" href="../index.html">✦ TECHNOVA</a><button id="menu" aria-label="Open navigation">☰</button><nav><a href="../index.html">Home</a><a href="events.html">Events</a><a href="technology.html">Technology</a><a href="innovation.html">Innovation</a><a href="news.html">News</a><a href="about.html">About</a><a href="contact.html">Contact</a><a href="account.html">My account</a></nav></header><main class="page"><p class="eyebrow">LEARNING PATHS</p><h1>Learn by <span>building.</span></h1><p class="lead">Choose a technology area and follow a practical path from foundations to a small project.</p><div class="path-controls"><input id="pathSearch" class="input" placeholder="Find a learning path…"></div><div class="path-layout"><section class="path-list" id="pathList"></section><section class="path-panel" id="pathPanel"></section></div></main><footer>© 2026 TechNova · Technology for what's next.</footer><script src="../js/script.js"></script><script>const paths=[{name:'AI Foundations',area:'AI',length:'4 stages',desc:'Go from core concepts to evaluating a small AI feature.',stages:[['01','Understand','Inputs, outputs, models and where AI fits into a product.'],['02','Prototype','Build a tiny feature and define what success looks like.'],['03','Evaluate','Test useful cases, edge cases and failure modes.'],['04','Ship','Wrap the feature in a clear interface and sensible controls.']]},{name:'Modern Web',area:'Web',length:'4 stages',desc:'Build a responsive web product with progressively stronger foundations.',stages:[['01','HTML & CSS','Structure content and build a responsive visual system.'],['02','JavaScript','Add state, events, validation and useful interactions.'],['03','Data','Connect your interface to an API or database.'],['04','Polish','Improve accessibility, performance and error states.']]},{name:'Cloud Builder',area:'Cloud',length:'4 stages',desc:'Learn the building blocks behind scalable application infrastructure.',stages:[['01','Architecture','Separate interfaces, services, data and identity.'],['02','Deploy','Move one small application to a managed platform.'],['03','Observe','Add logs, health checks and useful operational signals.'],['04','Scale','Think through caching, queues and growth constraints.']]},{name:'Security Essentials',area:'Security',length:'4 stages',desc:'Build security thinking into projects from the beginning.',stages:[['01','Identity','Understand authentication, sessions and permissions.'],['02','Threats','Map assets, trust boundaries and likely failure paths.'],['03','Protect','Use least privilege, safe secrets and input validation.'],['04','Review','Test the system and document what still needs work.']]},{name:'Interactive Systems',area:'Interactive',length:'4 stages',desc:'Design responsive realtime experiences that feel alive.',stages:[['01','Interaction','Map inputs, feedback and user intent.'],['02','Realtime','Build state updates and responsive feedback loops.'],['03','Performance','Measure the expensive parts and simplify them.'],['04','Experience','Tune pacing, accessibility and delight.']]}];const list=document.getElementById('pathList'),panel=document.getElementById('pathPanel'),search=document.getElementById('pathSearch');let selected=paths[0];function drawList(){const q=search.value.toLowerCase().trim();const shown=paths.filter(p=>!q||[p.name,p.area,p.desc].join(' ').toLowerCase().includes(q));list.innerHTML=shown.map(p=>'<button class="path-btn '+(p===selected?'active':'')+'" data-name="'+p.name+'"><strong>'+p.name+'</strong><br><small>'+p.area+' · '+p.length+'</small></button>').join('')||'<div class="panel">No matching learning paths.</div>';list.querySelectorAll('.path-btn').forEach(b=>b.addEventListener('click',()=>{selected=paths.find(p=>p.name===b.dataset.name)||selected;drawList();drawPanel()}))}function drawPanel(){panel.innerHTML='<span class="badge">'+selected.area+'</span><h2 style="font-size:32px;margin:12px 0 5px">'+selected.name+'</h2><p class="muted">'+selected.desc+'</p><div class="path-meta"><span class="lab-chip">'+selected.length+'</span><span class="lab-chip">Project-led</span></div><div class="phase-grid">'+selected.stages.map(s=>'<div class="phase"><strong>'+s[0]+' · '+s[1]+'</strong><span>'+s[2]+'</span></div>').join('')+'</div><div class="actions"><a class="btn primary" href="technology.html">Explore '+selected.area+' →</a><a class="btn" href="labs.html">Build something →</a></div>'}search.addEventListener('input',drawList);drawList();drawPanel();</script></body></html>
