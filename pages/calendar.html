<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calendar — TechNova</title><link rel="stylesheet" href="../css/style.css"><style>.cal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid #20324b;border-radius:16px;overflow:hidden;margin-top:22px}.cal-grid div{min-height:100px;padding:10px;border-right:1px solid #20324b;border-bottom:1px solid #20324b;background:#09111e}.cal-grid .day{min-height:auto;background:#10203a;color:#91a0b7;font-size:12px;font-weight:800}.cal-grid .today{outline:2px solid #32d6ff;outline-offset:-2px}@media(max-width:700px){.cal-grid{grid-template-columns:repeat(2,1fr)}.cal-grid .day{display:none}.cal-grid div{min-height:80px}}</style></head><body><header><a class="brand" href="../index.html">✦ TECHNOVA</a><button id="menu">☰</button><nav><a href="../index.html">Home</a><a href="events.html">Events</a><a href="technology.html">Technology</a><a class="active" href="calendar.html">Calendar</a><a href="gallery.html">Gallery</a><a href="integrations.html">Integrations</a><a href="account.html">My account</a></nav></header><main class="page"><p class="eyebrow">YOUR SCHEDULE</p><div class="cal-head"><div><h1 style="margin-bottom:6px">Calendar</h1><p class="lead" style="margin-top:0">Keep your TechNova events in one place and connect Google Calendar when you're ready.</p></div><a class="btn primary" href="integrations.html">Connect Google Calendar</a></div><section class="panel" style="margin-top:25px"><div class="cal-head"><h2 id="monthTitle">Calendar</h2><div><button class="btn" id="prev">←</button> <button class="btn" id="next">→</button></div></div><div id="calendar" class="cal-grid"></div></section></main><footer>© 2026 TechNova · Calendar</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase-config.js"></script><script src="../js/script.js"></script><script>const root=document.getElementById('calendar'),title=document.getElementById('monthTitle');let cursor=new Date();const render=()=>{const y=cursor.getFullYear(),m=cursor.getMonth();title.textContent=new Intl.DateTimeFormat('en-GB',{month:'long',year:'numeric'}).format(cursor);const first=new Date(y,m,1).getDay()||7,last=new Date(y,m+1,0).getDate();let html=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>'<div class="day">'+x+'</div>').join('');for(let i=1;i<first;i++)html+='<div></div>';for(let d=1;d<=last;d++){const today=new Date();const cls=today.getFullYear()===y&&today.getMonth()===m&&today.getDate()===d?'today':'';html+='<div class="'+cls+'"><strong>'+d+'</strong></div>'}root.innerHTML=html};document.getElementById('prev').onclick=()=>{cursor.setMonth(cursor.getMonth()-1);render()};document.getElementById('next').onclick=()=>{cursor.setMonth(cursor.getMonth()+1);render()};render();</script></body></html>
