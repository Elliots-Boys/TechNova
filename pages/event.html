<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Event · TechNova</title>
<link rel="stylesheet" href="../css/style.css">
<style>
.event-page{max-width:1000px;margin:auto;padding:55px 22px 80px}.event-hero{padding:30px;border:1px solid #20324b;border-radius:22px;background:linear-gradient(145deg,#10233d,#09111e)}.event-meta{color:#91a0b7;line-height:1.8}.event-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.capacity{margin-top:18px;padding:15px;border:1px solid #20324b;border-radius:14px;background:#08111e}.comments{margin-top:20px}.comment{padding:13px 0;border-bottom:1px solid #20324b}.comment small{color:#71859c}.comment p{margin:5px 0}.comment-form{display:grid;gap:10px;margin-top:15px}.comment-form textarea{min-height:90px}
</style>
</head>
<body>
<header><a class="brand" href="../index.html">✦ TECHNOVA</a><button id="menu" aria-label="Open menu" type="button">☰</button><nav><a href="../index.html">Home</a><a class="active" href="events.html">Events</a><a href="technology.html">Technology</a><a href="innovation.html">Innovation</a><a href="news.html">News</a><a href="about.html">About</a><a href="contact.html">Contact</a><a href="account.html">My account</a></nav></header>
<main class="event-page">
<div id="eventBox" class="event-hero"><p class="eyebrow">TECHNOVA EVENT</p><h1>Loading event…</h1></div>
<section class="comments panel"><h2>Comments</h2><div id="commentList"><p class="muted">Loading comments…</p></div><form id="commentForm" class="comment-form"><textarea id="commentText" placeholder="Write a comment…"></textarea><button class="btn primary" type="submit">Post comment</button></form></section>
</main><footer>© 2026 TechNova</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase-config.js"></script><script src="../js/saved-events.js"></script><script src="../js/event-capacity.js"></script><script src="../js/comments.js"></script><script src="../js/script.js"></script>
<script>
'use strict';
const id=new URLSearchParams(location.search).get('id');
const box=document.getElementById('eventBox');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
async function load(){
 if(!id){box.innerHTML='<h1>No event selected.</h1><a class="btn" href="events.html">Back to events</a>';return}
 try{
  const info=await TechNovaEventCapacity.availability(id); const e=info.event;
  box.innerHTML=`<p class="eyebrow">${esc(e.event_type||'EVENT')}</p><h1>${esc(e.title)}</h1><p class="event-meta">📅 ${esc(e.event_date||'—')} ${e.event_time?'· '+esc(e.event_time):''}<br>📍 ${esc(e.location||'—')}</p><p>${esc(e.description||'No description available.')}</p><div class="capacity">${info.capacity?`👥 ${info.registered} / ${info.capacity} registered · ${info.remaining} spaces remaining`:`👥 ${info.registered} registered`}</div><div class="event-actions"><a class="btn primary" href="register.html?id=${encodeURIComponent(e.id)}">Register</a><button id="saveBtn" class="btn">☆ Save event</button><button id="reportBtn" class="btn">Report</button></div>`;
  const save=document.getElementById('saveBtn');
  try{if(await TechNovaSavedEvents.isSaved(id)){save.textContent='★ Saved';save.classList.add('primary')}}catch{}
  save.onclick=async()=>{try{if(await TechNovaSavedEvents.isSaved(id)){await TechNovaSavedEvents.remove(id);save.textContent='☆ Save event'}else{await TechNovaSavedEvents.save(id);save.textContent='★ Saved'}}catch(err){alert(err.message)}};
  document.getElementById('reportBtn').onclick=()=>location.href=`reports.html?type=event&id=${encodeURIComponent(id)}`;
  loadComments();
 }catch(err){box.innerHTML='<h1>Could not load this event.</h1><p class="muted">The event may no longer exist.</p>';console.error(err)}
}
async function loadComments(){const list=document.getElementById('commentList');try{const comments=await TechNovaComments.list('event',id);list.innerHTML=comments.length?comments.map(c=>`<div class="comment"><small>${esc(c.profiles?.display_name||'TechNova member')} · ${c.created_at?new Date(c.created_at).toLocaleString():''}</small><p>${esc(c.content)}</p></div>`).join(''):'<p class="muted">No comments yet.</p>'}catch(e){list.innerHTML='<p class="muted">Comments are unavailable right now.</p>'}}
document.getElementById('commentForm').addEventListener('submit',async e=>{e.preventDefault();const text=document.getElementById('commentText').value.trim();if(!text)return;try{await TechNovaComments.add('event',id,text);document.getElementById('commentText').value='';loadComments()}catch(err){alert(err.message)}});
load();
</script>
</body>
</html>
