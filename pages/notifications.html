<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications · TechNova</title><link rel="stylesheet" href="../css/style.css"><style>.notifications-page{max-width:950px;margin:auto;padding:50px 22px 80px}.notification{padding:18px;border:1px solid #20324b;border-radius:16px;background:#0b1422;margin-bottom:12px}.notification.unread{border-color:#32d6ff55;background:#0d1d30}.notification h3{margin:0 0 6px}.notification p{color:#91a0b7;margin:0 0 10px}.notification-meta{font-size:13px;color:#6f8299;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.empty{color:#91a0b7}</style></head><body><header><a class="brand" href="../index.html">✦ TECHNOVA</a><button id="menu">☰</button><nav><a href="../index.html">Home</a><a href="events.html">Events</a><a href="technology.html">Technology</a><a href="innovation.html">Innovation</a><a href="news.html">News</a><a href="about.html">About</a><a href="contact.html">Contact</a><a href="account.html">My account</a></nav></header><main class="notifications-page"><p class="eyebrow">YOUR SPACE</p><h1>Notifications</h1><p class="lead">Stay up to date with TechNova activity and event reminders.</p><div class="toolbar"><button id="readAll" class="btn primary">Mark all as read</button><a class="btn" href="settings.html">Settings</a><a class="btn" href="account.html">Account</a></div><div id="list"><p class="empty">Loading notifications…</p></div></main><footer>© 2026 TechNova</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase-config.js"></script><script src="../js/notifications.js"></script><script src="../js/script.js"></script><script>const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function draw(){const box=document.getElementById('list');try{const items=await TechNovaNotifications.getNotifications();if(!items.length){box.innerHTML='<p class="empty">You have no notifications.</p>';return}box.innerHTML=items.map(n=>`<article class="notification ${n.is_read?'':'unread'}"><h3>${esc(n.title||'Notification')}</h3><p>${esc(n.message||'')}</p><div class="notification-meta"><span>${n.created_at?new Date(n.created_at).toLocaleString():''}</span>${n.is_read?'<span>Read</span>':`<button class="btn" data-id="${esc(n.id)}">Mark as read</button>`}</div></article>`).join('');box.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{try{await TechNovaNotifications.markRead(b.dataset.id);draw()}catch(e){alert(e.message)}})}catch(e){box.innerHTML='<p class="empty">Notifications are not available yet. This page needs notification data/RLS access to be enabled.</p>';console.error(e)}}document.getElementById('readAll').onclick=async()=>{try{await TechNovaNotifications.markAllRead();draw()}catch(e){alert(e.message)}};draw();</script></body></html>
