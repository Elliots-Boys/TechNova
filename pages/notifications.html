<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications · TechNova</title><link rel="stylesheet" href="../css/style.css"></head><body><header><a class="brand" href="../index.html">✦ TECHNOVA</a><button id="menu">☰</button><nav><a href="../index.html">Home</a><a href="events.html">Events</a><a href="technology.html">Technology</a><a href="innovation.html">Innovation</a><a href="news.html">News</a><a href="discover.html">Discover</a><a href="account.html">My account</a></nav></header><main class="page"><p class="eyebrow">YOUR SPACE</p><h1>Stay in the <span>loop.</span></h1><p class="lead">A lightweight notification centre for event reminders and TechNova updates.</p><section class="panel"><label style="display:flex;gap:12px;align-items:center;margin-bottom:20px"><input type="checkbox" id="events" checked> Event reminders</label><label style="display:flex;gap:12px;align-items:center;margin-bottom:20px"><input type="checkbox" id="updates" checked> Product updates</label><label style="display:flex;gap:12px;align-items:center"><input type="checkbox" id="community"> Community activity</label><div class="actions"><button class="btn primary" id="save">Save preferences</button><a class="btn" href="settings.html">More settings</a></div></section></main><footer>© 2026 TechNova · Technology for what's next.</footer><script src="../js/script.js"></script><script>['events','updates','community'].forEach(k=>{const v=localStorage.getItem('technova_notify_'+k);if(v!==null)document.getElementById(k).checked=v==='true'});document.getElementById('save').onclick=()=>{['events','updates','community'].forEach(k=>localStorage.setItem('technova_notify_'+k,document.getElementById(k).checked));window.TechNovaToast?.('Notification preferences saved.');if(!window.TechNovaToast)alert('Saved!')};</script></body></html>
