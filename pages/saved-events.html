<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Saved events · TechNova</title><link rel="stylesheet" href="../css/style.css"><style>.saved-events-page{max-width:1100px;margin:auto;padding:55px 22px 80px}.saved-events-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;margin-top:25px}.saved-event{padding:20px;border:1px solid #20324b;border-radius:16px;background:#09111e}.saved-event p{color:#91a0b7}.saved-event-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}@media(max-width:700px){.saved-events-grid{grid-template-columns:1fr}}</style></head>
<body><header><a class="brand" href="../index.html">✦ TECHNOVA</a><button id="menu">☰</button><nav><a href="../index.html">Home</a><a href="events.html">Events</a><a href="technology.html">Technology</a><a href="innovation.html">Innovation</a><a href="news.html">News</a><a href="about.html">About</a><a href="contact.html">Contact</a><a href="account.html">My account</a></nav></header>
<main class="saved-events-page"><p class="eyebrow">YOUR EVENTS</p><h1>Saved <span>events.</span></h1><p class="lead">Keep events you are interested in one place.</p><div id="savedEvents" class="saved-events-grid"><p style="color:#91a0b7">Loading…</p></div></main><footer>© 2026 TechNova</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase-config.js"></script><script src="../js/saved-events.js"></script><script src="../js/script.js"></script>
<script>function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}async function draw(){const box=document.getElementById('savedEvents');try{const items=await TechNovaSavedEvents.list();if(!items.length){box.innerHTML='<div class="panel"><h2>No saved events yet</h2><p class="muted">Save an event from the events area to see it here.</p><a class="btn primary" href="events.html">Browse events →</a></div>';return}box.innerHTML=items.map(x=>{const e=x.events||{};return `<article class="saved-event"><span class="badge">${esc(e.event_type||'EVENT')}</span><h2>${esc(e.title||'Untitled event')}</h2><p>📅 ${esc(e.event_date||'—')} ${e.event_time?'· '+esc(e.event_time):''}<br>📍 ${esc(e.location||'—')}</p><div class="saved-event-actions"><a class="btn primary" href="event.html?id=${encodeURIComponent(e.id||x.event_id)}">View event</a><button class="btn" data-id="${esc(x.event_id)}">Remove</button></div></article>`}).join('');box.querySelectorAll('button[data-id]').forEach(b=>b.onclick=async()=>{try{await TechNovaSavedEvents.remove(b.dataset.id);draw()}catch(e){alert(e.message)}})}catch(e){box.innerHTML='<div class="panel"><p class="muted">Could not load saved events. Please sign in and make sure saved-event access is available.</p></div>';console.error(e)}}draw();</script></body></html>
